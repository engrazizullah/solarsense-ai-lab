[project]
name = "solarsense-backend"
version = "0.1.0"
description = "SolarSense AI Lab — FastAPI backend"
readme = "README.md"
authors = [
    { name = "Aziz Ullah", email = "azizch19999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]
